<!doctype html>
<html lang="es">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <meta name="theme-color" content="#050507" />
    <title>HoopMind · Sin conexión</title>
    <style>
      :root { color-scheme: dark; }
      * { box-sizing: border-box; }
      body {
        margin: 0;
        min-height: 100dvh;
        display: flex;
        align-items: center;
        justify-content: center;
        font-family: system-ui, -apple-system, Segoe UI, Roboto, sans-serif;
        color: #f6f7f9;
        background:
          radial-gradient(40rem 40rem at 20% -10%, rgba(255,94,26,0.18), transparent 60%),
          radial-gradient(40rem 40rem at 110% 10%, rgba(76,201,255,0.12), transparent 55%),
          #050507;
        text-align: center;
        padding: 24px;
      }
      .card {
        max-width: 360px;
        padding: 28px;
        border-radius: 24px;
        background: rgba(16,16,22,0.72);
        border: 1px solid rgba(255,255,255,0.08);
        backdrop-filter: blur(16px);
      }
      .logo {
        width: 56px; height: 56px; margin: 0 auto 16px;
        display: flex; align-items: center; justify-content: center;
        border-radius: 16px; font-weight: 900; font-size: 24px; color: #0a0a0c;
        background: linear-gradient(135deg, #ff7a40, #ff5e1a);
        box-shadow: 0 12px 40px -10px rgba(255,94,26,0.6);
      }
      h1 { font-size: 20px; margin: 0 0 8px; }
      p { color: #9aa0a8; font-size: 14px; margin: 0 0 20px; line-height: 1.5; }
      button {
        width: 100%; min-height: 48px; border: 0; border-radius: 14px;
        font-weight: 700; font-size: 15px; color: #0a0a0c; cursor: pointer;
        background: linear-gradient(180deg, #ff7a40, #ff5e1a);
      }
    </style>
  </head>
  <body>
    <div class="card">
      <div class="logo">H</div>
      <h1>Sin conexión</h1>
      <p>No hay internet ahora mismo. Tu progreso en curso se guarda y se
        sincroniza cuando vuelvas a conectarte.</p>
      <button onclick="location.reload()">Reintentar</button>
    </div>
  </body>
</html>
